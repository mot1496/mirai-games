<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3.14 チャレンジ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Layout: a single chalkboard column. Timing switch under the subtitle, equation, six choices in a 2x3 grid, feedback with the mnemonic. */
  :root{
    --board:#2c4638;
    --chalk:#f2efe6;
    --chalk-dim:#c9cdbf;
    --yellow:#f2c94c;
    --coral:#e8836b;
    --line:rgba(242,239,230,0.18);
    --font-display:'Klee One', 'Hiragino Mincho ProN', serif;
    --font-body:'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    background-color:var(--board);
    background-image:radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:6px 6px;
    color:var(--chalk);
    font-family:var(--font-body);
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-block:20px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  .sheet{ width:100%; max-width:420px; }
  .title{
    font-family:var(--font-display);
    font-size:1.6rem;
    text-align:center;
    margin:0 0 4px;
    color:var(--yellow);
    letter-spacing:.02em;
  }
  .sub{ text-align:center; color:var(--chalk-dim); font-size:.85rem; margin:0 0 14px; }

  .time-switch{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:0 auto 18px;
    width:fit-content;
    font-size:.85rem;
    color:var(--chalk-dim);
    cursor:pointer;
    user-select:none;
  }
  .time-switch input{
    appearance:none;
    -webkit-appearance:none;
    margin:0;
    width:40px;
    height:22px;
    border:2px solid var(--chalk-dim);
    border-radius:11px;
    background:transparent;
    position:relative;
    cursor:pointer;
    transition:border-color .15s, background-color .15s;
  }
  .time-switch input::after{
    content:"";
    position:absolute;
    top:2px;
    left:2px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--chalk-dim);
    transition:transform .15s, background-color .15s;
  }
  .time-switch input:checked{ border-color:var(--yellow); background:rgba(242,201,76,0.15); }
  .time-switch input:checked::after{ transform:translateX(18px); background:var(--yellow); }
  .time-switch input:focus-visible{ outline:2px solid var(--yellow); outline-offset:3px; }
  .time-switch .state{ min-width:2.2em; font-weight:700; color:var(--chalk-dim); }
  .time-switch input:checked ~ .state{ color:var(--yellow); }

  .dots{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
  .dot{ width:12px; height:12px; border-radius:50%; border:2px solid var(--chalk-dim); background:transparent; }
  .dot.done{ background:var(--yellow); border-color:var(--yellow); }
  .dot.wrong{ background:var(--coral); border-color:var(--coral); }

  .board-inner{
    border:2px dashed var(--line);
    border-radius:4px;
    padding:28px 20px;
    text-align:center;
  }
  .timer{
    font-family:var(--font-display);
    font-size:1.1rem;
    color:var(--chalk-dim);
    margin-bottom:10px;
    font-variant-numeric:tabular-nums;
  }
  .timer.running{ color:var(--yellow); }
  .equation{ font-size:2.1rem; font-weight:900; letter-spacing:.02em; margin-bottom:26px; }
  .equation .op{ color:var(--chalk-dim); font-weight:500; margin:0 6px; }

  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .choice{
    font-family:inherit;
    font-size:1.15rem;
    font-weight:700;
    color:var(--chalk);
    background:transparent;
    border:2px solid var(--line);
    border-radius:4px;
    padding:14px 8px;
    cursor:pointer;
    font-variant-numeric:tabular-nums;
    transition:border-color .15s, transform .1s;
  }
  .choice:hover{ border-color:var(--chalk-dim); }
  .choice:active{ transform:scale(.97); }
  .choice:focus-visible{ outline:2px solid var(--yellow); outline-offset:2px; }
  .choice.correct{ border-color:var(--yellow); color:var(--yellow); }
  .choice.wrong{ border-color:var(--coral); color:var(--coral); }
  .choice[disabled]{ cursor:default; }

  .feedback{ min-height:60px; margin-top:16px; font-size:.9rem; line-height:1.6; color:var(--chalk-dim); }
  .feedback .goro{ color:var(--yellow); }

  .result{ text-align:center; }
  .score{ font-family:var(--font-display); font-size:3rem; color:var(--yellow); margin:0; }
  .score span{ font-size:1.4rem; color:var(--chalk-dim); }
  .msg{ margin:10px 0 18px; color:var(--chalk-dim); font-size:.95rem; }
  .stats{ display:flex; justify-content:center; gap:28px; margin:0 0 18px; }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .k{ font-size:.75rem; color:var(--chalk-dim); letter-spacing:.06em; }
  .stat .v{ font-family:var(--font-display); font-size:1.5rem; color:var(--chalk); font-variant-numeric:tabular-nums; }
  .log{ list-style:none; margin:0 0 24px; padding:0; border-top:1px solid var(--line); text-align:left; }
  .log li{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:12px;
    align-items:baseline;
    padding:8px 4px;
    border-bottom:1px solid var(--line);
    font-size:.9rem;
    font-variant-numeric:tabular-nums;
  }
  .log .q{ color:var(--chalk-dim); }
  .log .t{ color:var(--chalk); }
  .log .mark{ width:1.2em; text-align:center; font-weight:700; }
  .log .mark.ok{ color:var(--yellow); }
  .log .mark.ng{ color:var(--coral); }
  .no-time-note{ margin:0 0 24px; font-size:.8rem; color:var(--chalk-dim); }

  .again{
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    color:var(--board);
    background:var(--yellow);
    border:none;
    border-radius:4px;
    padding:14px 28px;
    cursor:pointer;
  }
  .again:active{ transform:scale(.98); }
  .again:focus-visible{ outline:2px solid var(--chalk); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    .choice, .time-switch input, .time-switch input::after{ transition:none; }
    .choice:active, .again:active{ transform:none; }
  }
</style>

<div class="sheet">
  <p class="title">3.14 チャレンジ</p>
  <p class="sub">3.14 × 2〜9 を覚えよう</p>

  <label class="time-switch" for="timeToggle">
    <span>時間を計る</span>
    <input type="checkbox" id="timeToggle" role="switch">
    <span class="state" id="timeState">なし</span>
  </label>

  <div class="dots" id="dots"></div>

  <div class="board-inner" id="quizView">
    <div class="timer" id="timer" aria-hidden="true" hidden>0.0 秒</div>
    <div class="equation" id="equation"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>

  <div class="board-inner result" id="resultView" hidden>
    <p class="score" id="scoreText"></p>
    <p class="msg" id="scoreMsg"></p>
    <div class="stats" id="stats" hidden>
      <div class="stat"><span class="k">合計</span><span class="v" id="totalTime"></span></div>
      <div class="stat"><span class="k">1問平均</span><span class="v" id="avgTime"></span></div>
    </div>
    <ul class="log" id="log" hidden></ul>
    <p class="no-time-note" id="noTimeNote" hidden>時間計測を入れて全問解くと、ここに解答時間が出ます。</p>
    <button class="again" id="retryBtn" type="button">もう一回</button>
  </div>
</div>

<script>
const table = [3.14,6.28,9.42,12.56,15.7,18.84,21.98,25.12,28.26];
const goro = {
  2:'ろっぱにっぱ',
  3:'くしにっし',
  4:'いちにっころ',
  5:'いちごなな',
  6:'いっぱーやよん',
  7:'にいちきゅっぱ',
  8:'にこいちに',
  9:'にっぱろっく'
};
const CHOICE_COUNT = 6;
const STORE_KEY = 'pi-drill-timing';

let order = [];
let idx = 0;
let results = [];
let times = [];      // 各問の解答時間(ミリ秒)。計測なしの問題は null
let timingOn = false;
let locked = false;
let startedAt = 0;
let tick = null;

const dotsEl = document.getElementById('dots');
const eqEl = document.getElementById('equation');
const choicesEl = document.getElementById('choices');
const feedbackEl = document.getElementById('feedback');
const quizView = document.getElementById('quizView');
const resultView = document.getElementById('resultView');
const scoreText = document.getElementById('scoreText');
const scoreMsg = document.getElementById('scoreMsg');
const timerEl = document.getElementById('timer');
const toggleEl = document.getElementById('timeToggle');
const stateEl = document.getElementById('timeState');
const statsEl = document.getElementById('stats');
const totalEl = document.getElementById('totalTime');
const avgEl = document.getElementById('avgTime');
const logEl = document.getElementById('log');
const noTimeNoteEl = document.getElementById('noTimeNote');

function fmt(ms){ return (ms/1000).toFixed(1) + ' 秒'; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---- 時間計測 ---- */
function startTimer(){
  stopTimer();
  startedAt = performance.now();
  timerEl.hidden = false;
  timerEl.classList.add('running');
  timerEl.textContent = fmt(0);
  tick = setInterval(()=>{ timerEl.textContent = fmt(performance.now() - startedAt); }, 100);
}

function stopTimer(){
  if(tick !== null){ clearInterval(tick); tick = null; }
  timerEl.classList.remove('running');
}

function applyTiming(on){
  timingOn = on;
  toggleEl.checked = on;
  stateEl.textContent = on ? 'あり' : 'なし';
  if(!on){
    stopTimer();
    timerEl.hidden = true;
  }else if(!locked && !quizView.hidden){
    startTimer();
  }
}

toggleEl.addEventListener('change', ()=>{
  applyTiming(toggleEl.checked);
  try{ localStorage.setItem(STORE_KEY, toggleEl.checked ? '1' : '0'); }catch(e){}
});

/* ---- 選択肢づくり ---- */
// 正解と同じ小数第2位までの値で、まぎらわしい候補を(CHOICE_COUNT - 1)個つくる
function makeChoices(correct){
  const cents = Math.round(correct*100);
  const set = new Set([cents]);
  while(set.size < CHOICE_COUNT){
    const step = Math.random() < 0.5 ? 1 : (Math.floor(Math.random()*4)+1)*10;
    const delta = (Math.floor(Math.random()*7)-3) * step;
    let candidate = cents + delta;
    if(candidate <= 0) candidate = cents + Math.floor(Math.random()*300) + 10;
    set.add(candidate);
  }
  return shuffle(Array.from(set));
}

function renderDots(){
  dotsEl.innerHTML = '';
  for(let i=0;i<order.length;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    if(results[i]==='done') d.classList.add('done');
    if(results[i]==='wrong') d.classList.add('wrong');
    dotsEl.appendChild(d);
  }
}

function startGame(){
  order = shuffle([2,3,4,5,6,7,8,9]);
  idx = 0;
  results = new Array(order.length).fill(null);
  times = new Array(order.length).fill(null);
  quizView.hidden = false;
  resultView.hidden = true;
  renderDots();
  renderQuestion();
}

function renderQuestion(){
  locked = false;
  feedbackEl.textContent = '';
  const n = order[idx];
  const correctCents = Math.round(table[n-1]*100);
  eqEl.innerHTML = `3.14<span class="op">×</span>${n}<span class="op">=</span>?`;
  choicesEl.innerHTML = '';
  makeChoices(table[n-1]).forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.type = 'button';
    btn.dataset.cents = String(c);
    btn.textContent = (c/100).toFixed(2);
    btn.addEventListener('click', ()=>selectAnswer(btn, c, correctCents));
    choicesEl.appendChild(btn);
  });
  if(timingOn) startTimer();
}

function selectAnswer(btn, cents, correctCents){
  if(locked) return;
  locked = true;
  let elapsed = null;
  if(timingOn){
    elapsed = performance.now() - startedAt;
    stopTimer();
    timerEl.textContent = fmt(elapsed);
  }
  times[idx] = elapsed;

  const allBtns = choicesEl.querySelectorAll('.choice');
  allBtns.forEach(b=>b.disabled = true);
  const isCorrect = cents === correctCents;
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if(!isCorrect){
    allBtns.forEach(b=>{
      if(Number(b.dataset.cents) === correctCents) b.classList.add('correct');
    });
  }
  results[idx] = isCorrect ? 'done' : 'wrong';
  renderDots();

  const n = order[idx];
  let line = isCorrect ? '正解!' : `おしい。正解は ${(correctCents/100).toFixed(2)}`;
  if(elapsed !== null) line += `(${fmt(elapsed)})`;
  feedbackEl.innerHTML = `${line}<br><span class="goro">${goro[n]}</span>`;

  setTimeout(()=>{
    idx++;
    if(idx < order.length){
      renderQuestion();
    }else{
      showResult();
    }
  }, 900);
}

function showResult(){
  stopTimer();
  quizView.hidden = true;
  resultView.hidden = false;
  const score = results.filter(r=>r==='done').length;
  scoreText.innerHTML = `${score}<span>/${order.length}</span>`;
  let msg = '';
  if(score===order.length) msg = '満点!すっかり覚えたね。';
  else if(score>=7) msg = 'あと少し!もう一周してみよう。';
  else msg = 'くり返し練習あるのみ。';
  scoreMsg.textContent = msg;

  const allTimed = times.every(t => t !== null);
  const anyTimed = times.some(t => t !== null);
  statsEl.hidden = !allTimed;
  logEl.hidden = !allTimed;
  noTimeNoteEl.hidden = allTimed || anyTimed;
  if(allTimed){
    const total = times.reduce((a,b)=>a+b, 0);
    totalEl.textContent = fmt(total);
    avgEl.textContent = fmt(total / order.length);
    logEl.innerHTML = '';
    order.forEach((n, i)=>{
      const li = document.createElement('li');
      const ok = results[i] === 'done';
      li.innerHTML = `<span class="q">3.14 × ${n}</span><span class="t">${fmt(times[i])}</span><span class="mark ${ok ? 'ok' : 'ng'}">${ok ? '○' : '×'}</span>`;
      logEl.appendChild(li);
    });
  }else if(anyTimed){
    // 途中で切り替えた場合は、一部の問題だけ計測されているため合計は出さない
    noTimeNoteEl.hidden = false;
    noTimeNoteEl.textContent = '途中で時間計測を切り替えたため、解答時間は表示しません。';
  }else{
    noTimeNoteEl.textContent = '時間計測を入れて全問解くと、ここに解答時間が出ます。';
  }
}

document.getElementById('retryBtn').addEventListener('click', startGame);

let saved = null;
try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
applyTiming(saved === '1');
startGame();
</script>

</body></html>
